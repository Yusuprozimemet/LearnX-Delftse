name: PR checks

# Checks on every pull request:
#
# 1. The description uses the template. GitHub only auto-fills the template in
#    the web "compose" form and in `gh pr create` with no --body. A pull request
#    opened through the REST API or `gh pr create --body "..."`, which is the
#    path most AI tools take, silently skips it. This check is the only thing
#    that actually enforces it.
#
# 2. The diff stays reviewable. A two thousand line pull request does not get
#    reviewed, it gets approved, which is not the same thing. Size is the real
#    problem behind unreviewable AI-generated changes, so the limit is a number
#    rather than an awkward conversation between teammates.
#
# 3. The frozen files stay unedited: the project file's `frozen` patterns, such as
#    migrations that have run and the tests that show the code still behaves after
#    a change. Additions and pure renames within the frozen set pass, so a move stays
#    possible; an edit, a delete or a move out of the set fails and names the file, and
#    so does a drop in the project file's `test_count` (scripts/invariants.py).
#
# 4. Every service is wired: built in compose with a healthcheck that allows its start, and
#    scraped by Prometheus on its management port (scripts/service-wiring.py). Each extraction
#    day repeated this by hand, and two dropped the scrape job.
#
# 5. The branch, the title, the commits and the Jira keys agree (scripts/pr-names.py). The dashboard
#    reads a day's progress from branch names and Jira from the keys; in the project the kit was copied from, three PRs that
#    disagreed showed a wrong state after they merged (a `track-b` branch for track B1, one Jira key against another,
#    a `claude/...` branch).
#
# 6. A track's new tests are seen red (scripts/track-red.py): each test its spec's `new` criteria
#    name fails by assertion where the branch started and passes on it. A pilot of the kit merged two tracks without the record.
#    Opt-in: set TRACK_RED_RUNNER to `unittest`, `pytest`, `maven`, or `npm`.
#    Unset, it reports "not configured" and passes; any other value
#    fails as a configuration error. Its self-tests run in spec-drift-tests.yml whatever the setting.
#
# 7. Criteria keep their wording, tags and IDs outside spec-change PRs (criteria-wording.py).
#
# 8. Style check: STYLE_CHECK_COMMAND runs the project's check-only style command.
#    Unset, it reports "not configured" and passes.
#
# Recovery is automatic for the first two and the fifth's title and description: editing the description fires the `edited`
# event and re-runs these checks. No new commit needed.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  MAX_CHANGED_LINES: 400

jobs:
  body:
    name: Description uses the template
    runs-on: ubuntu-latest
    steps:
      - name: Check required sections are present
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          required=(
            "## What I built"
            "## Why this approach"
            "## Contract impact"
            "## How to run"
            "## Self-check"
          )
          missing=()
          for section in "${required[@]}"; do
            if ! printf '%s' "$PR_BODY" | grep -qiF "$section"; then
              missing+=("$section")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Your pull request description is missing required sections. Start from .github/pull_request_template.md and keep these headings:"
            for m in "${missing[@]}"; do echo "  - $m"; done
            echo ""
            echo "Click 'Edit' on the description, paste the template, and fill it in."
            echo "Editing the description re-runs this check automatically."
            exit 1
          fi
          echo "All required sections present."

  size:
    name: Diff stays reviewable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count changed lines, excluding generated files
        id: count
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three-dot diff: merge-base..head, same scope as GitHub's "Files changed".
          # Two-dot base..head counts main-only commits when the branch is behind.
          changed=$(git diff --numstat "$BASE_SHA"..."$HEAD_SHA" -- \
            . \
            ':(exclude)**/uv.lock' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)**/poetry.lock' \
            ':(exclude)**/*.lock' \
            ':(exclude)**/target/**' \
            ':(exclude)**/dbt_packages/**' \
            ':(exclude)**/node_modules/**' \
            | awk '{ add += ($1 == "-" ? 0 : $1); del += ($2 == "-" ? 0 : $2) } END { print add + del + 0 }')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed lines, excluding generated files: $changed"

      - name: Enforce the limit, unless an override is documented
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED: ${{ steps.count.outputs.changed }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" -le "$MAX_CHANGED_LINES" ]; then
            echo "$CHANGED changed lines is within the limit of $MAX_CHANGED_LINES."
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*Oversized:[[:space:]]*\S'; then
            echo "::warning::$CHANGED changed lines exceeds $MAX_CHANGED_LINES, but an 'Oversized:' reason is documented in the description."
            exit 0
          fi
          echo "::error::$CHANGED changed lines exceeds the limit of $MAX_CHANGED_LINES."
          echo ""
          echo "Split this into smaller pull requests, one purpose each. A reviewer cannot"
          echo "meaningfully check a change this size, and approving it without reading is"
          echo "worse than not reviewing at all."
          echo ""
          echo "If it genuinely cannot be split, add a line to the description:"
          echo "  Oversized: <one sentence saying why>"
          echo "Editing the description re-runs this check."
          exit 1

  invariants:
    name: Frozen files stay unedited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the base
        # The frozen patterns are the project file's (spec-drift.config.json, `frozen`); none, it says so.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/invariants.py "$BASE_SHA" "$HEAD_SHA"

  service-wiring:
    name: Every service is wired into compose and Prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/test_service_wiring.py
      - run: python scripts/service-wiring.py
        if: hashFiles('services/**') != ''  # it lists services/; with none it would fail on every PR

  behaviour-index:
    name: "Replaces: lines name real earlier criteria"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python scripts/test_behaviour_index.py
      - run: python scripts/behaviour-index.py

  names:
    name: Branch, title, commits and Jira keys agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_pr_names.py
      - name: Compare the names
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JIRA_KEY: ${{ vars.JIRA_KEY }}
        run: python scripts/pr-names.py "$BASE_SHA" "$HEAD_SHA"

  seen-red:
    name: Track tests seen red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}  # the branch itself, not the merge commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run each new criterion's test on the base and the head
        # The base is where the branch started, as the size check's three-dot diff counts from.
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRACK_RED_RUNNER: ${{ vars.TRACK_RED_RUNNER }}
        run: >-
          python scripts/track-red.py --branch "$PR_BRANCH" --runner "$TRACK_RED_RUNNER"
          --base "$(git merge-base "$BASE_SHA" "$HEAD_SHA")"

  style:
    name: Style check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check style
        env:
          STYLE_CHECK_COMMAND: ${{ vars.STYLE_CHECK_COMMAND }}
        run: |
          if [ -z "$STYLE_CHECK_COMMAND" ]; then
            echo "not configured: STYLE_CHECK_COMMAND is not set"
          else
            bash -e -c "$STYLE_CHECK_COMMAND"
          fi

  criteria-wording:
    name: Criteria keep their wording
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare accepted criteria with the head
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/criteria-wording.py --branch "$PR_BRANCH"
          --base "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" --head "$HEAD_SHA"
