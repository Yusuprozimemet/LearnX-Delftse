name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests import only the standard library and delftse/; requirements.txt's TTS and
      # LLM clients are for the daily run.
      - run: pip install "pytest>=8.0"
      - run: python -m pytest -q -p no:cacheprovider tests
